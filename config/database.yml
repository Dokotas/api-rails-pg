default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  username: hirer_admin
  password: <%= ENV["DB_PASSWORD"] %>
  timeout: 5000
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: api_hirer_development

test:
  <<: *default
  database: api_hirer_test

production:
  <<: *default
  database: api_hirer_production